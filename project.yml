name: MDViewer

options:
  bundleIdPrefix: io.github.hshimomura
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"

configs:
  Debug: debug
  Release: release

packages:
  Textual:
    url: https://github.com/gonzalezreal/textual
    exactVersion: 0.5.0
  SwiftUIMath:
    url: https://github.com/gonzalezreal/swiftui-math
    exactVersion: 0.1.0
  ConcurrencyExtras:
    url: https://github.com/pointfreeco/swift-concurrency-extras
    exactVersion: 1.4.0

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_VERSION: "6.0"

targets:
  MDPreview:
    type: application
    platform: macOS
    sources:
      - path: Sources/MDPreview
        excludes:
          - Resources
      - path: Sources/MDPreview/Resources/Mermaid
        buildPhase: resources
        type: folder
      - path: Resources/AppIcon.xcassets
        buildPhase: resources
      - path: Packaging/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
      - path: Legal
        buildPhase: resources
        type: folder
    dependencies:
      - package: Textual
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Packaging/MDViewer.entitlements
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "13"
        DEVELOPMENT_TEAM: ZLX73742D3
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Packaging/Info.plist
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: io.github.hshimomura.MDViewer
        PRODUCT_MODULE_NAME: MDPreview
        PRODUCT_NAME: MD Viewer
        SWIFT_STRICT_CONCURRENCY: complete

  MDPreviewTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/MDPreviewTests
    dependencies:
      - target: MDPreview
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ZLX73742D3
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.hshimomura.MDViewerTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MD Viewer.app/Contents/MacOS/MD Viewer"

schemes:
  MDPreview:
    build:
      targets:
        MDPreview: all
        MDPreviewTests:
          - test
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MDPreviewTests
    archive:
      config: Release
